# Shell (host): SPA + federation manifest. SPA fallback to index.html.
# Iteracion 50: escucha en 8080 (usuario no root no puede enlazar <1024);
# el compose publica 440x -> 8080.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/headers.conf;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html sin cache: cada deploy debe servir el HTML nuevo de inmediato
  # (los assets con hash se cachean en la location siguiente).
  location = /index.html {
    include /etc/nginx/conf.d/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # remoteEntry.json sin cache (mismo criterio que remote.conf): un redeploy
  # con nuevos hashes no debe dejar consumers cargando chunks inexistentes.
  location = /remoteEntry.json {
    include /etc/nginx/conf.d/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* \.(js|css|json|ico|svg|woff2?)$ {
    # Una sola cabecera Cache-Control (expires anadiria otra duplicada).
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
}
