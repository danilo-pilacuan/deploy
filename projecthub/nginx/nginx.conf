# Configuracion principal de nginx para ejecucion sin privilegios (iteracion 50).
# - Sin directiva user: el master corre como el usuario de la imagen (uid 101)
#   y los workers heredan ese uid.
# - pid y temp paths bajo /tmp: unico directorio escribible garantizado para
#   el usuario no root (tmpfs del compose). /var/cache/nginx es root:root y
#   nginx no puede crear subdirectorios ahi.
# - Logs a los std streams del contenedor (docker logs).
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # conf.d contiene default.conf (server del shell o del remote, listen 8080)
  # y headers.conf (cabeceras compartidas; incluida tambien por cada server).
  include /etc/nginx/conf.d/*.conf;
}
