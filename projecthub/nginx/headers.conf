# Cabeceras de seguridad basicas compartidas por shell y remotes (iteracion 50).
# Se incluyen dentro de cada server; los headers se declaran a nivel server
# y se redeclaran en las locations que anaden los suyos (nginx no hereda
# add_header cuando la location define el propio).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# server_tokens off se declara en nginx.conf (bloque http); aqui duplicarlo
# daria error porque headers.conf se incluye en dos niveles.
