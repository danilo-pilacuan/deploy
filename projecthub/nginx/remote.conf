# Remote: serves remoteEntry.json + chunks. SPA fallback for deep links (F5).
# CORS: the shell runtime fetches remoteEntry.json cross-origin (4400 -> 440x).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index remoteEntry.json;

  add_header Access-Control-Allow-Origin "*" always;

  location / {
    try_files $uri $uri/ /remoteEntry.json;
  }

  location ~* \.(js|css|json|ico|svg|woff2?)$ {
    expires 1h;
    # nginx drops inherited add_header when a location defines its own.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
