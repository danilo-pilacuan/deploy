# Remote: serves remoteEntry.json + chunks. SPA fallback for deep links (F5).
# CORS: the shell runtime fetches remoteEntry.json cross-origin (4400 -> 440x).
# Iteracion 50: escucha en 8080 (usuario no root no puede enlazar <1024);
# el compose publica 440x -> 8080.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index remoteEntry.json;

  include /etc/nginx/conf.d/headers.conf;

  add_header Access-Control-Allow-Origin "*" always;

  location / {
    try_files $uri $uri/ /remoteEntry.json;
  }

  # remoteEntry.json sin cache: si se cachea, un redeploy con nuevos hashes
  # deja a los consumers cargando chunks inexistentes hasta vencer el TTL.
  location = /remoteEntry.json {
    include /etc/nginx/conf.d/headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* \.(js|css|json|ico|svg|woff2?)$ {
    # Una sola cabecera Cache-Control (expires anadiria otra duplicada).
    # nginx drops inherited add_header when a location defines its own.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
}
