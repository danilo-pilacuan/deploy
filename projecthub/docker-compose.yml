# ProjectHub demo stack (DEC-002): shell + 4 remotes + API + db behind nginx.
# Ports 4400-4404 per DEC-001 (4200-4204 occupied on host; 4300-4304 = local dev).
# API on 8100 (reserved for it per DEC-001) and db on 5433 (DEC-006). The API
# builds with DATABASE_URL pointing at the `db` service; the frontends keep
# API_BASE_URL default http://localhost:8100, so the host port must stay 8100.
# Build context is the workspace root: docker compose -f deploy/projecthub/docker-compose.yml up --build
name: projecthub

services:
  db:
    image: postgres:17-alpine
    container_name: projecthub-db-demo
    restart: unless-stopped
    ports:
      # Host 5433 is taken by the backend dev compose db (projecthub-db);
      # the API reaches this one internally as db:5432, the host port is
      # for inspection only.
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projecthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar}
      POSTGRES_DB: ${POSTGRES_DB:-projecthub}
    volumes:
      - projecthub_pgdata_demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projecthub} -d ${POSTGRES_DB:-projecthub}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Hardening (iteracion 50): filesystem de solo lectura y limits basicos.
    # postgres:alpine necesita escribir en /var/run/postgresql y /tmp.
    tmpfs:
      - /var/run/postgresql
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../..
      dockerfile: deploy/projecthub/api.Dockerfile
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://projecthub:cambiar@db:5432/projecthub}
      AUTH_SECRET: ${AUTH_SECRET:-projecthub-demo-secret-cambiar-32bytes}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Hardening (iteracion 50).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  shell:
    build:
      context: ../..
      dockerfile: deploy/projecthub/shell.Dockerfile
    ports:
      - "4400:8080"
    restart: unless-stopped
    # Hardening (iteracion 50): nginx corre como usuario no root en la
    # imagen; contenedor sin escritura en disco raiz.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true

  mfe-projects:
    build:
      context: ../..
      dockerfile: deploy/projecthub/remote.Dockerfile
      args:
        ARG_REPO: mfe-projects
    ports:
      - "4401:8080"
    restart: unless-stopped
    # Hardening (iteracion 50).
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true

  mfe-reports:
    build:
      context: ../..
      dockerfile: deploy/projecthub/remote.Dockerfile
      args:
        ARG_REPO: mfe-reports
    ports:
      - "4402:8080"
    restart: unless-stopped
    # Hardening (iteracion 50).
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true

  mfe-admin:
    build:
      context: ../..
      dockerfile: deploy/projecthub/remote.Dockerfile
      args:
        ARG_REPO: mfe-admin
    ports:
      - "4403:8080"
    restart: unless-stopped
    # Hardening (iteracion 50).
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true

  mfe-governance:
    build:
      context: ../..
      dockerfile: deploy/projecthub/remote.Dockerfile
      args:
        ARG_REPO: mfe-governance
    ports:
      - "4404:8080"
    restart: unless-stopped
    # Hardening (iteracion 50).
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true

volumes:
  projecthub_pgdata_demo:
